<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirumani Nadar - Centered Portrait Page</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Premium, high-quality spiritual textured background image */
            background: url('https://freepik.com') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        /* Overlay to enhance background image contrast and visibility */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.75);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 90%;
        }
        .icon-wrapper {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .icon {
            width: 35px;
            height: 35px;
            fill: #b58900;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.15));
        }
        .center-text {
            font-size: 3rem;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: 1px;
            margin: 0;
            position: relative;
            display: inline-block;
            padding: 5px 20px;
            /* Highlighting effect using a soft radiant gradient and subtle text shadow */
            background: linear-gradient(120deg, rgba(255, 223, 0, 0.4) 0%, rgba(255, 200, 0, 0.6) 100%);
            border-radius: 8px;
            text-shadow: 0 2px 10px rgba(255, 223, 0, 0.3);
            box-shadow: inset 0 -3px 0 rgba(181, 137, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Built-in SVG decorative icons positioned elegantly above the name -->
        <!-- <div class="icon-wrapper">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12,6.5A5.5,5.5 0 0,1 17.5,12A5.5,5.5 0 0,1 12,17.5A5.5,5.5 0 0,1 6.5,12A5.5,5.5 0 0,1 12,6.5M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4Z"/>
            </svg>
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 2L1 21h22L12 2zm0 4l7.5 13h-15L12 6z"/>
            </svg>
        </div> -->
        
        <!-- Highlighted central text element -->
        <h1 class="center-text">Jesingha</h1>
    </div>

</body>
</html>
